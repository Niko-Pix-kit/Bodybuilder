[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bodybuilder-reconstruction"
version = "0.2.0"
description = "Local, provenance-aware reconstruction of cropped and fragmented photographs"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{name = "Niko-Pix-kit"}]
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "Pillow>=10.4,<13",
  "pillow-heif>=0.18,<2",
  "PyQt6>=6.7,<7",
]

[project.optional-dependencies]
ai = [
  "accelerate>=0.34",
  "diffusers>=0.31",
  "safetensors>=0.4",
  "torch>=2.3",
  "transformers>=4.44",
]
dev = ["pytest>=8.3", "pytest-cov>=5", "ruff>=0.8"]

[project.scripts]
bodybuilder = "bodybuilder.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
