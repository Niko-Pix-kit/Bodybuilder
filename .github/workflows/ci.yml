name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon0 libdbus-1-3
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Compile
        run: python -m compileall -q src tests
      - name: Test core and offscreen desktop UI
        run: pytest

  ai-api:
    name: Real AI APIs (${{ matrix.stack }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: minimum
            diffusers: diffusers==0.31.0
            transformers: transformers==4.57.1
          - stack: current
            diffusers: diffusers
            transformers: transformers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install real AI libraries and tests
        run: python -m pip install -e ".[ai,dev]" "${{ matrix.diffusers }}" "${{ matrix.transformers }}"
      - name: Record installed versions
        run: python -m pip freeze
      - name: Verify real inpainting, VAE and region-conditioning APIs
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          BODYBUILDER_REQUIRE_AI_TESTS: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: python -m pytest tests/test_diffusers_runtime.py tests/test_subject_runtime.py -v
      - name: Load actual subject detector and run all three vision tasks
        if: matrix.stack == 'current'
        env:
          BODYBUILDER_REQUIRE_AI_TESTS: "1"
          BODYBUILDER_TEST_VISION_WEIGHTS: "1"
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: python -m pytest tests/test_subject_runtime.py::test_subject_detector_with_real_weights -v
